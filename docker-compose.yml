services:
  app:
    image: ${APP_IMAGE:-donorconnect:local}
    build:
      context: ./
    restart: always
    ports:
      - "80:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://donorconnect:donorconnect_pw@db:5432/donorconnect_db}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: donorconnect
      POSTGRES_PASSWORD: donorconnect_pw
      POSTGRES_DB: donorconnect_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donorconnect -d donorconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
