# Workflow name shown in the GitHub Actions UI
name: Basic CI

# Triggers that start this workflow
on:
  push:
    branches: ["main"]
  pull_request:

# All jobs (independent units of work) in this workflow
jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store (restore)
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Set up environment variables
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          echo "DATABASE_URL is set (masked)"
          echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"

      - name: Generate Prisma client (optional)
        if: ${{ steps.install.outcome == 'success' }}
        run: pnpm prisma:generate

      - name: Run ESLint
        if: ${{ steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Run TypeScript checks (tsc --noEmit)
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            pnpm exec tsc --noEmit
          else
            echo "No tsconfig.json found; skipping tsc (this repo is JS-first)."
          fi

      - name: next build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Cache pnpm store (save)
        if: ${{ always() && steps.install.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

  docker:
    name: Docker Build + Deploy
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build + push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/donorconnect:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/donorconnect:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/donorconnect:latest
            ghcr.io/${{ github.repository_owner }}/donorconnect:${{ github.sha }}

      - name: Deploy (no-op unless configured)
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$CI_RESULT" != "success" ]; then
            echo "Skipping deploy because CI job failed ($CI_RESULT)."
            exit 0
          fi
          if [ -z "${DOCKER_REGISTRY:-}" ] || [ -z "${DOCKER_REPOSITORY:-}" ] || [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
            echo "Deploy not configured. Set secrets DOCKER_REGISTRY, DOCKER_REPOSITORY, DOCKER_USERNAME, DOCKER_PASSWORD to enable pushing the image."
            exit 0
          fi
          echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
          docker tag "donorconnect:$IMAGE_TAG" "$DOCKER_REGISTRY/$DOCKER_REPOSITORY:$IMAGE_TAG"
          docker push "$DOCKER_REGISTRY/$DOCKER_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            IMAGE_TAG=${{ github.sha }}
            DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY || '' }}
            DOCKER_REPOSITORY=${{ secrets.DOCKER_REPOSITORY || '' }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME || '' }}
            DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD || '' }}
          timeout: 30s
          command_timeout: 20m
          script: |
            set -eux
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io docker-compose-v2
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi
            
            if [ -n "${DOCKER_REGISTRY:-}" ] && [ -n "${DOCKER_REPOSITORY:-}" ] && [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_PASSWORD:-}" ]; then
              echo "Using Docker registry for deployment..."
              echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
              IMAGE_NAME="$DOCKER_REGISTRY/$DOCKER_REPOSITORY:$IMAGE_TAG"
              docker pull "$IMAGE_NAME"
            else
              echo "No Docker registry configured; building directly on EC2..."
              IMAGE_NAME="donorconnect:$IMAGE_TAG"
              if [ ! -d "donorconnect" ]; then
                git clone https://github.com/slumpshouse/donorconnect.git
              fi
              cd donorconnect
              git fetch --all
              git reset --hard origin/main
              git checkout main
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              export PATH="$HOME/.local/share/pnpm:$PATH"
              pnpm install --frozen-lockfile
              pnpm prisma:generate
              pnpm build
              docker build -t "$IMAGE_NAME" .
              cd ..
            fi
            
            docker stop donorconnect-app || true
            docker rm donorconnect-app || true
            docker run -d --name donorconnect-app -p 3000:3000 -e DATABASE_URL="$DATABASE_URL" -e HOSTNAME=0.0.0.0 -e PORT=3000 "$IMAGE_NAME"
            sleep 10
            docker ps | grep -q donorconnect-app
            docker logs donorconnect-app --tail 50

            
            # Run the new container with environment variables
            docker run -d --name donorconnect-app \
              -p 3000:3000 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e HOSTNAME=0.0.0.0 \
              -e PORT=3000 \
              "$IMAGE_NAME"
            echo "App deployed and running on port 3000"
            
            # Wait a moment and check if container is running
            sleep 5
            if docker ps | grep -q donorconnect-app; then
              echo "✅ Container is running successfully"
              echo "🌐 Access your app at: http://${{ secrets.EC2_HOST }}:3000"
            else
              echo "❌ Container failed to start. Checking logs..."
              docker logs donorconnect-app || echo "No logs available"
              exit 1
            fi
 
