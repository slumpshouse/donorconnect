# Workflow name shown in the GitHub Actions UI
name: Basic CI

# Triggers that start this workflow
on:
  push:
    branches: ["main"]
  pull_request:

# All jobs (independent units of work) in this workflow
jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store (restore)
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Set up environment variables
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          echo "DATABASE_URL is set (masked)"
          echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"

      - name: Generate Prisma client (optional)
        if: ${{ steps.install.outcome == 'success' }}
        run: pnpm prisma:generate

      - name: Run ESLint
        if: ${{ steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Run TypeScript checks (tsc --noEmit)
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            pnpm exec tsc --noEmit
          else
            echo "No tsconfig.json found; skipping tsc (this repo is JS-first)."
          fi

      - name: next build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Cache pnpm store (save)
        if: ${{ always() && steps.install.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

  docker:
    name: Docker Build + Deploy
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build + push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/donorconnect:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/donorconnect:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/donorconnect:latest
            ghcr.io/${{ github.repository_owner }}/donorconnect:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        if: ${{ needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e

            PROJECT_PATH="${{ secrets.EC2_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="$HOME/donorconnect"
            fi

            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              # Note: usermod only takes effect in a new login session.
              # All docker commands below use sudo so this session works immediately.
              sudo usermod -aG docker $USER
            fi

            if ! sudo docker compose version > /dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            mkdir -p "$(dirname "$PROJECT_PATH")"

            if [ ! -d "$PROJECT_PATH/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sudo docker pull ghcr.io/${{ github.repository_owner }}/donorconnect:latest

            cat > .env.production <<'EOF'
            DATABASE_URL=postgresql://donorconnect:donorconnect_pw@db:5432/donorconnect_db
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            APP_IMAGE=ghcr.io/${{ github.repository_owner }}/donorconnect:latest
            EOF

            # Normalize accidental wrapped quotes in DATABASE_URL.
            sed -i "s/^DATABASE_URL='\(.*\)'$/DATABASE_URL=\1/" .env.production
            sed -i 's/^DATABASE_URL="\(.*\)"$/DATABASE_URL=\1/' .env.production

            sudo docker compose -f docker-compose.prod.yml --env-file .env.production pull app
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production down
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            # Schema and seed are handled by the 'migrate' compose service.
            # App depends_on migrate completing, so we just wait for app healthy.
            echo "Waiting for migrate + app to become healthy (up to 3 min)..."
            timeout 180 sh -c 'until [ "$(sudo docker inspect -f "{{.State.Health.Status}}" $(sudo docker compose -f docker-compose.prod.yml --env-file .env.production ps -q app))" = "healthy" ]; do sleep 5; done' \
              && echo "App is healthy." \
              || echo "Health check timed out - check: sudo docker compose -f docker-compose.prod.yml logs"

            sudo docker image prune -f
 
