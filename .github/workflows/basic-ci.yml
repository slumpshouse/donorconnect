# Workflow name shown in the GitHub Actions UI
name: Basic CI

# Triggers that start this workflow
on:
  push:
    branches: ["main"]
  pull_request:

# All jobs (independent units of work) in this workflow
jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store (restore)
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Set up environment variables
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          echo "DATABASE_URL is set (masked)"
          echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"

      - name: Generate Prisma client (optional)
        if: ${{ steps.install.outcome == 'success' }}
        run: pnpm prisma:generate

      - name: Run ESLint
        if: ${{ steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Run TypeScript checks (tsc --noEmit)
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            pnpm exec tsc --noEmit
          else
            echo "No tsconfig.json found; skipping tsc (this repo is JS-first)."
          fi

      - name: next build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Cache pnpm store (save)
        if: ${{ always() && steps.install.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm exec prisma migrate deploy

  docker:
    name: Docker Build + Deploy
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build + push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/donorconnect:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/donorconnect:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/donorconnect:latest
            ghcr.io/${{ github.repository_owner }}/donorconnect:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        if: ${{ needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e

            PROJECT_PATH="${{ secrets.EC2_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="$HOME/donorconnect"
            fi

            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi

            if ! docker compose version > /dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            mkdir -p "$(dirname "$PROJECT_PATH")"

            if [ ! -d "$PROJECT_PATH/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/donorconnect:latest

            cat > .env.production <<EOF
DATABASE_URL=${{ secrets.DATABASE_URL }}
OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
APP_IMAGE=ghcr.io/${{ github.repository_owner }}/donorconnect:latest
EOF

            docker compose --env-file .env.production pull app
            docker compose --env-file .env.production down
            docker compose --env-file .env.production up -d

            echo "Waiting for app to become healthy..."
            timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" $(docker compose --env-file .env.production ps -q app))" = "healthy" ]; do sleep 3; done' || echo "Health check timed out - container may still be starting"

            docker image prune -f
 
