services:
  app:
    image: ${APP_IMAGE:-donorconnect:local}
    restart: always
    ports:
      - "80:3000"
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
